name: Build OpenWrt image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: master
          fetch-depth: 1

      - name: Checkout this repo (overlay files)
        uses: actions/checkout@v4
        with:
          path: port

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl
          sudo -E apt-get -y autoremove --purge

      - name: Apply device port files
        run: |
          cp -v port/files/target/linux/econet/dts/en7528_nokia_g2425g-a.dts target/linux/econet/dts/
          cp -v port/files/target/linux/econet/image/en7528.mk target/linux/econet/image/
          cp -v port/files/target/linux/econet/base-files/etc/board.d/02_network \
             target/linux/econet/base-files/etc/board.d/
          cp -v port/files/target/linux/econet/base-files/lib/upgrade/platform.sh \
             target/linux/econet/base-files/lib/upgrade/

      - name: Configure
        run: |
          cp port/config.seed .config
          make defconfig
          grep -E "^CONFIG_TARGET_DEVICE|CONFIG_PACKAGE_kmod-mt7" .config || true

      - name: Download sources
        run: make -j$(nproc) download

      - name: Build
        run: |
          make -j$(nproc) IGNORE_ERRORS=n m -i 2>&1 | tee build.log | tail -50
          ./staging_dir/host/bin/ccache -s 2>/dev/null || true

      - name: Show target images
        run: |
          ls -lh bin/targets/*/*/ || true
          cat bin/targets/*/*/profiles.json 2>/dev/null | head -40 || true

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nokia-g2425g-a
          path: bin/targets/*/*/
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
