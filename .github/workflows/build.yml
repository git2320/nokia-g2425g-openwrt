name: Build OpenWrt image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout upstream OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: master
          fetch-depth: 1

      - name: Checkout this repo (overlay files)
        uses: actions/checkout@v4
        with:
          path: port

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl ccache

      - name: Apply device port files
        run: |
          cp -v port/files/target/linux/econet/dts/en7528_nokia_g2425g-a.dts target/linux/econet/dts/
          cp -v port/files/target/linux/econet/image/en7528.mk target/linux/econet/image/
          cp -v port/files/target/linux/econet/base-files/etc/board.d/02_network \
             target/linux/econet/base-files/etc/board.d/
          cp -v port/files/target/linux/econet/base-files/lib/upgrade/platform.sh \
             target/linux/econet/base-files/lib/upgrade/
          mkdir -p files
          cp -Rv port/files/root-overlay/. files/
          chmod 755 files/etc/uci-defaults/99-wifi-recovery \
            files/etc/uci-defaults/99-bootlog-enable \
            files/etc/init.d/econet-bootlog \
            files/etc/init.d/econet-commit \
            files/usr/sbin/bootflag-commit

      - name: Restore ccache + downloads cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            dl/
          key: ${{ runner.os }}-openwrt-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-openwrt-ccache-

      - name: Configure (minimal)
        run: |
          cp port/config.seed .config
          cat port/files/target/linux/econet/config-minimal >> .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_CCACHE_DIR=$(pwd)/.ccache" >> .config
          make defconfig
          grep -c "^CONFIG_PACKAGE.*=y" .config

      - name: Download sources (only our target)
        run: make -j$(nproc) download

      - name: Build (minimal, parallel)
        env:
          MAKEFLAGS: "-j$(nproc)"
        run: |
          make -j$(nproc) BUILD_LOG=1 V=s 2>&1 | tail -100
          ls -lh bin/targets/*/*/ || true

      - name: Save ccache stats
        if: always()
        run: ccache -s 2>/dev/null || true

      - name: Show target images
        if: always()
        run: |
          ls -lh bin/targets/*/*/ || true
          cat bin/targets/*/*/profiles.json 2>/dev/null | head -40 || true

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nokia-g2425g-a
          path: bin/targets/*/*/
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/
          retention-days: 14